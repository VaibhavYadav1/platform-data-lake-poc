# E2: deploy on every merge to main, with no manual step.
#
# Order matters: images first, then Terraform, so the Cloud Run jobs point at an image that
# already exists. Terraform applies shared, then dev, then int (once int.tfvars exists).
#
# Trigger: pushes to main, created in terraform/shared/cloudbuild_main.tf.
# Images are tagged with the commit SHA, so every run traces back to its code.
# Terraform receives the tag as TF_VAR_image_tag (ignored until a module declares it, E3).
#
# Steps whose input isn't merged yet (Dockerfiles, int files) print SKIPPED and pass.
# dbt docs (E10) are generated and published after the Terraform steps.

substitutions:
  _TF_IMAGE: hashicorp/terraform:1.17
  _REGION: us-central1
  _REPO: poc # Artifact Registry repository, created in terraform/shared/cloudbuild_main.tf
  _PY_IMAGE: python:3.12-slim
  _SDK_IMAGE: gcr.io/google.com/cloudsdktool/cloud-sdk:slim

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s

steps:
  # ------------------------------------------------------------------- Images
  - id: image-dbt-runner
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        if [ ! -f dbt/Dockerfile ]; then
          echo "SKIPPED image-dbt-runner: dbt/Dockerfile not merged yet (E3)"; exit 0
        fi
        img=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/dbt-runner
        # Context is the repo root: the image copies dbt/ and orchestration/publish/
        docker build -f dbt/Dockerfile --build-arg GIT_SHA=$COMMIT_SHA -t "$$img:$COMMIT_SHA" -t "$$img:latest" .
        docker push "$$img" --all-tags

  - id: image-crm-loader
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        if [ ! -f loaders/crm/Dockerfile ]; then
          echo "SKIPPED image-crm-loader: loaders/crm/Dockerfile not merged yet (B3)"; exit 0
        fi
        img=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/crm-loader
        docker build -f loaders/crm/Dockerfile --build-arg GIT_SHA=$COMMIT_SHA -t "$$img:$COMMIT_SHA" -t "$$img:latest" loaders/crm
        docker push "$$img" --all-tags

  - id: image-simulator
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        if [ ! -f simulator/Dockerfile ]; then
          echo "SKIPPED image-simulator: simulator/Dockerfile not found"; exit 0
        fi
        img=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/poc-source-simulator
        docker build -f simulator/Dockerfile -t "$$img:$COMMIT_SHA" simulator
        docker push "$$img" --all-tags

  # ---------------------------------------------------------------- Terraform
  # Sequential: shared first, because the environments depend on it. A lock timeout lets two
  # quick merges queue behind each other on the state lock instead of failing.
  - id: apply-shared
    name: ${_TF_IMAGE}
    waitFor: [image-dbt-runner, image-crm-loader, image-simulator]
    dir: terraform/shared
    entrypoint: sh
    env: ["TF_VAR_image_tag=$COMMIT_SHA"]
    args:
      - -c
      - |
        set -eu
        terraform init -input=false -backend-config=backend.hcl
        terraform apply -input=false -auto-approve -lock-timeout=300s -var-file=terraform.tfvars

  - id: apply-dev
    name: ${_TF_IMAGE}
    waitFor: [apply-shared]
    dir: terraform/env
    entrypoint: sh
    env:
      - TF_VAR_image_tag=$COMMIT_SHA
      - TF_VAR_crm_loader_image_tag=latest
    args:
      - -c
      - |
        set -eu
        terraform init -input=false -backend-config=dev.backend.hcl
        terraform apply -input=false -auto-approve -lock-timeout=300s -var-file=dev.tfvars

  # int: the same commit as dev. Added from Day 9 (E9); skipped until its files exist.
  - id: apply-int
    name: ${_TF_IMAGE}
    waitFor: [apply-dev]
    dir: terraform/env
    entrypoint: sh
    env:
      - TF_VAR_image_tag=$COMMIT_SHA
      - TF_VAR_crm_loader_image_tag=latest
    args:
      - -c
      - |
        set -eu
        if [ ! -f int.tfvars ] || [ ! -f int.backend.hcl ]; then
          echo "SKIPPED apply-int: int.tfvars / int.backend.hcl not written yet (E9)"; exit 0
        fi
        # dev and int use different state, so start from a clean init
        rm -rf .terraform
        terraform init -input=false -reconfigure -backend-config=int.backend.hcl
        terraform apply -input=false -auto-approve -lock-timeout=300s -var-file=int.tfvars

  # ------------------------------------------------------------ dbt docs (E10)
  # Generate the dbt documentation and publish it to gs://<project>-dbt-docs/<env>/index.html.
  # Two steps per environment, on plain images, so a merge before the dbt project exists still
  # passes: a step whose image was the dbt-runner would fail at the pull, before its skip check.
  #   docs-<env>          dbt docs generate --static   (one self-contained HTML file)
  #   publish-docs-<env>  copy it, and manifest.json beside it (AT-37 reads the descriptions there)
  # `--static` writes target/static_index.html; target/index.html is the version that needs the
  # JSON files next to it, so it is NOT the file to publish.
  - id: docs-dev
    name: ${_PY_IMAGE}
    waitFor: [apply-dev]
    dir: dbt
    entrypoint: sh
    env:
      - DBT_PROFILES_DIR=.
      - GCP_PROJECT=$PROJECT_ID
    args:
      - -c
      - |
        set -eu
        if [ ! -f dbt_project.yml ]; then
          echo "SKIPPED docs-dev: dbt/dbt_project.yml not merged yet (0.4)"; exit 0
        fi
        pip install --quiet --no-cache-dir -r requirements.txt
        dbt deps
        dbt docs generate --static --target dev

  - id: publish-docs-dev
    name: ${_SDK_IMAGE}
    waitFor: [docs-dev]
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        if [ ! -f dbt/target/static_index.html ]; then
          echo "SKIPPED publish-docs-dev: no docs were generated"; exit 0
        fi
        dest=gs://$PROJECT_ID-dbt-docs/dev
        gcloud storage cp dbt/target/static_index.html "$$dest/index.html"
        gcloud storage cp dbt/target/manifest.json "$$dest/manifest.json"
        echo "dbt docs published: https://storage.cloud.google.com/$PROJECT_ID-dbt-docs/dev/index.html"

  - id: docs-int
    name: ${_PY_IMAGE}
    waitFor: [apply-int]
    dir: dbt
    entrypoint: sh
    env:
      - DBT_PROFILES_DIR=.
      - GCP_PROJECT=$PROJECT_ID
    args:
      - -c
      - |
        set -eu
        if [ ! -f ../terraform/env/int.tfvars ] || [ ! -f dbt_project.yml ]; then
          echo "SKIPPED docs-int: int environment (E9) or the dbt project not merged yet"; exit 0
        fi
        pip install --quiet --no-cache-dir -r requirements.txt
        dbt deps
        dbt docs generate --static --target int

  - id: publish-docs-int
    name: ${_SDK_IMAGE}
    waitFor: [docs-int]
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        if [ ! -f dbt/target/static_index.html ]; then
          echo "SKIPPED publish-docs-int: no docs were generated"; exit 0
        fi
        dest=gs://$PROJECT_ID-dbt-docs/int
        gcloud storage cp dbt/target/static_index.html "$$dest/index.html"
        gcloud storage cp dbt/target/manifest.json "$$dest/manifest.json"
        echo "dbt docs published: https://storage.cloud.google.com/$PROJECT_ID-dbt-docs/int/index.html"
