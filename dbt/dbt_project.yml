name: poc_dwh
version: "0.2.0"
config-version: 2
profile: poc_dwh

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

vars:
  g2_raw_dataset: raw_g2          # override for parity runs: raw_g2_parity
  crm_raw_dataset: raw_crm
  lpos_raw_dataset: raw_lpos
  g2dl_dataset: sim_g2_datalake
  g2dl_project: "{{ target.project }}"
  future_tolerance_minutes: 5     # DQ34
  incremental_lookback_minutes: 30
  golden_step: baseline           # which golden_store_health checkpoint the golden test compares
  pii_deny_columns: ["email", "phone", "first_name", "last_name", "user_name", "contact_name"]

models:
  poc_dwh:
    +labels: {poc: phase2, managed_by: dbt}
    staging:
      +schema: stg
      +materialized: view
    intermediate:
      +schema: prep
      +materialized: table
    marts:
      +schema: build
      +materialized: table
      +contract: {enforced: true}
      +on_schema_change: fail      # incremental facts: a column change must be noticed, not absorbed
    rollups:
      +schema: build
      +materialized: table
      +contract: {enforced: true}
    security:
      +schema: build          # published to sec_{env} by publish.py
      +materialized: table
      +contract: {enforced: true}

seeds:
  poc_dwh:
    +schema: prep
    +labels: {poc: phase2, managed_by: dbt}

tests:
  +store_failures: true
  +schema: dq
