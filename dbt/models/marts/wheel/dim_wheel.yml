version: 2
models:
  - name: dim_wheel
    description: One row per cart wheel with the tenant of its store.
    columns:
      - name: wheel_id
        description: "Wheel key"
        data_type: "string"
        data_tests: [unique, not_null]
      - name: tenant_id
        description: "From dim_store"
        data_type: "string"
      - name: store_id
        description: G2 store the wheel belongs to
        data_type: string
        data_tests:
          - not_null
          - relationships: {to: ref('dim_store'), field: store_id, config: {severity: warn}}
      - name: cart_id
        description: "Cart the wheel is fitted to"
        data_type: "string"
      - name: installed_at
        description: "When it was fitted"
        data_type: "timestamp"
      - name: status
        description: ACTIVE or INACTIVE
        data_type: string
        data_tests:
          - accepted_values: {values: [ACTIVE, INACTIVE]}
      - name: _source_system
        description: "Lineage"
        data_type: "string"
      - name: _source_updated_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_loaded_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_invocation_id
        description: "Lineage"
        data_type: "string"
