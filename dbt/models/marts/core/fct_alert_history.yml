version: 2
models:
  - name: fct_alert_history
    description: One row per incident event (status change, assignment, comment), including deleted ones. The person who acted is a token. Incremental merge on history_id.
    columns:
      - name: history_id
        description: "Event key and merge key"
        data_type: "string"
        data_tests: [unique, not_null]
      - name: tenant_id
        description: "Tenant from the incident's store"
        data_type: "string"
      - name: incident_id
        description: Incident the event belongs to
        data_type: string
        data_tests:
          - not_null
          - relationships: {to: ref('fct_alert'), field: incident_id, config: {severity: warn}}
      - name: event_time
        description: "When the event happened"
        data_type: "timestamp"
        data_tests: [not_null]
      - name: event_date
        description: "DATE of event_time; partition column"
        data_type: "date"
      - name: change_type
        description: Event type
        data_type: string
        data_tests:
          - accepted_values: {values: [CREATED, ASSIGNED, STATUS_CHANGED, COMMENT, RESOLVED, REOPENED, MONITORING_TIMEOUT]}
      - name: change
        description: "Display text"
        data_type: "string"
      - name: previous_status_id
        description: "Null for CREATED and COMMENT"
        data_type: "string"
      - name: new_status_id
        description: "Null for COMMENT"
        data_type: "string"
      - name: changed_by_token
        description: "Tokenised user; null for system events"
        data_type: "string"
      - name: comments
        description: "Notes"
        data_type: "string"
      - name: store_id
        description: "From the incident; null for an orphan event"
        data_type: "string"
      - name: device_id
        description: "From the incident"
        data_type: "string"
      - name: alert_type_id
        description: "From the incident"
        data_type: "string"
      - name: brand
        description: "Brand name"
        data_type: "string"
      - name: ultimate_parent
        description: "Company"
        data_type: "string"
      - name: country
        description: "ISO country code"
        data_type: "string"
      - name: level_1
        description: "Region"
        data_type: "string"
      - name: level_2
        description: "Division"
        data_type: "string"
      - name: level_3
        description: "District"
        data_type: "string"
      - name: level_4
        description: "Spare"
        data_type: "string"
      - name: level_5
        description: "Spare"
        data_type: "string"
      - name: level_6
        description: "Spare"
        data_type: "string"
      - name: level_7
        description: "Spare"
        data_type: "string"
      - name: is_deleted
        description: "Deleted in G2"
        data_type: "bool"
      - name: deleted_at
        description: "When it was deleted"
        data_type: "timestamp"
      - name: _source_system
        description: "Lineage"
        data_type: "string"
      - name: _source_updated_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_loaded_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_invocation_id
        description: "Lineage"
        data_type: "string"
