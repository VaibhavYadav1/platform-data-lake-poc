version: 2
models:
  - name: status
    description: Handling-status lookup behind the status columns on the facts. Built from stg_g2__statuses. Not tenant-scoped.
    columns:
      - name: status_id
        description: "Status key"
        data_type: "string"
        data_tests: [unique, not_null]
      - name: status_name
        description: "Label; incidents and history are matched on it"
        data_type: "string"
        data_tests: [unique, not_null]
      - name: is_closed
        description: "Whether the status means the incident is finished"
        data_type: "bool"
      - name: next_step_action
        description: "Shared action; null for Not Started"
        data_type: "string"
      - name: _source_system
        description: "Lineage"
        data_type: "string"
      - name: _source_updated_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_loaded_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_invocation_id
        description: "Lineage"
        data_type: "string"
