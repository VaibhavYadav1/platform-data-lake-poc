version: 2
models:
  - name: mv_downtime_interval
    description: One row per merged downtime period per store, all stores including inactive. Overlapping RED alerts merge into one period.
    data_tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [store_id, interval_seq]}
    columns:
      - name: store_id
        description: "Store"
        data_type: "string"
        data_tests: [not_null]
      - name: interval_seq
        description: "1, 2, 3 and so on by start"
        data_type: "int64"
        data_tests: [not_null]
      - name: tenant_id
        description: "From dim_store"
        data_type: "string"
      - name: store_name
        description: "From dim_store"
        data_type: "string"
      - name: downtime_start
        description: "Start of the merged period"
        data_type: "timestamp"
      - name: downtime_end
        description: "End; an ongoing period ends at snapshot_ts"
        data_type: "timestamp"
      - name: is_ongoing
        description: "A RED incident is still open"
        data_type: "bool"
      - name: downtime_minutes
        description: "Length in minutes"
        data_type: "int64"
      - name: incident_count
        description: "RED incidents merged"
        data_type: "int64"
      - name: contributing_incident_ids
        description: "For explainability"
        data_type: "array<string>"
      - name: downtime_cause_types
        description: "Distinct cause types"
        data_type: "array<string>"
      - name: snapshot_ts
        description: "The run's as-of time"
        data_type: "timestamp"
      - name: brand
        description: "Brand name"
        data_type: "string"
      - name: ultimate_parent
        description: "Company"
        data_type: "string"
      - name: country
        description: "ISO country code"
        data_type: "string"
      - name: level_1
        description: "Region"
        data_type: "string"
      - name: level_2
        description: "Division"
        data_type: "string"
      - name: level_3
        description: "District"
        data_type: "string"
      - name: level_4
        description: "Spare"
        data_type: "string"
      - name: level_5
        description: "Spare"
        data_type: "string"
      - name: level_6
        description: "Spare"
        data_type: "string"
      - name: level_7
        description: "Spare"
        data_type: "string"
      - name: _source_system
        description: "Lineage"
        data_type: "string"
      - name: _source_updated_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_loaded_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_invocation_id
        description: "Lineage"
        data_type: "string"
