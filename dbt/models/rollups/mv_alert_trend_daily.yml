version: 2
models:
  - name: mv_alert_trend_daily
    description: Store by alert type by day, zero-filled. How many alerts each store raised per type per day, and how many were repeats of the same alert stream. The native view in wh is the published version.
    data_tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [alert_date, store_id, alert_type_id]}
    columns:
      - name: alert_date
        description: "UTC date of alert_time; partition column"
        data_type: "date"
        data_tests: [not_null]
      - name: store_id
        description: "Store"
        data_type: "string"
        data_tests: [not_null]
      - name: alert_type_id
        description: "Alert type"
        data_type: "string"
        data_tests: [not_null]
      - name: tenant_id
        description: "From dim_store"
        data_type: "string"
      - name: alert_name
        description: "Customer alert name"
        data_type: "string"
      - name: incident_count
        description: "Incidents created that day, deleted ones excluded"
        data_type: "int64"
      - name: distinct_alert_count
        description: "Distinct alert_id that day"
        data_type: "int64"
      - name: repeat_incident_count
        description: "incident_count minus distinct_alert_count"
        data_type: "int64"
      - name: snapshot_ts
        description: "The run's as-of time"
        data_type: "timestamp"
      - name: brand
        description: "Brand name"
        data_type: "string"
      - name: ultimate_parent
        description: "Company"
        data_type: "string"
      - name: country
        description: "ISO country code"
        data_type: "string"
      - name: level_1
        description: "Region"
        data_type: "string"
      - name: level_2
        description: "Division"
        data_type: "string"
      - name: level_3
        description: "District"
        data_type: "string"
      - name: level_4
        description: "Spare"
        data_type: "string"
      - name: level_5
        description: "Spare"
        data_type: "string"
      - name: level_6
        description: "Spare"
        data_type: "string"
      - name: level_7
        description: "Spare"
        data_type: "string"
      - name: _source_system
        description: "Lineage"
        data_type: "string"
      - name: _source_updated_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_loaded_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_invocation_id
        description: "Lineage"
        data_type: "string"
