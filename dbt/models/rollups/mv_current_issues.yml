version: 2
models:
  - name: mv_current_issues
    description: The work queue - each door with an open health-relevant problem, its worst alert, what to do and who owns it. Active stores only.
    columns:
      - name: issue_id
        description: "store_id and door name joined with a pipe; __UNKNOWN__ for an unknown door"
        data_type: "string"
        data_tests: [unique, not_null]
      - name: tenant_id
        description: "From dim_store"
        data_type: "string"
      - name: alert_ids
        description: "Open incident ids at this door"
        data_type: "array<string>"
      - name: primary_alert_id
        description: "Worst colour, then oldest, then id"
        data_type: "string"
        data_tests: [not_null]
      - name: store_id
        description: Store
        data_type: string
        data_tests:
          - not_null
          - relationships: {to: ref('dim_store'), field: store_id}
      - name: store_name
        description: "From dim_store"
        data_type: "string"
      - name: store_number
        description: "From dim_store"
        data_type: "string"
      - name: system_type
        description: "Primary alert type's system_type"
        data_type: "string"
      - name: main_door_indicator
        description: "From dim_device; null for an unknown device"
        data_type: "bool"
      - name: installed_location_name
        description: "Door name"
        data_type: "string"
      - name: alert_name
        description: "Primary alert's customer name"
        data_type: "string"
      - name: alert_description
        description: "Primary alert's description"
        data_type: "string"
      - name: issue_type
        description: "Primary alert's customer category"
        data_type: "string"
      - name: severity
        description: "Primary alert's severity"
        data_type: "string"
      - name: issue_color
        description: "Primary alert's effective colour"
        data_type: "string"
      - name: is_unclassified
        description: "Primary alert has no rule"
        data_type: "bool"
      - name: issue_owner_token
        description: "Token of the primary alert's assignee"
        data_type: "string"
      - name: owner_team
        description: "Team of that assignee"
        data_type: "string"
      - name: next_step_action
        description: "Primary alert's next step"
        data_type: "string"
      - name: issue_opened_at
        description: "Earliest alert_time of the open incidents"
        data_type: "timestamp"
      - name: snapshot_ts
        description: "The run's as-of time"
        data_type: "timestamp"
      - name: brand
        description: "Brand name"
        data_type: "string"
      - name: ultimate_parent
        description: "Company"
        data_type: "string"
      - name: country
        description: "ISO country code"
        data_type: "string"
      - name: level_1
        description: "Region"
        data_type: "string"
      - name: level_2
        description: "Division"
        data_type: "string"
      - name: level_3
        description: "District"
        data_type: "string"
      - name: level_4
        description: "Spare"
        data_type: "string"
      - name: level_5
        description: "Spare"
        data_type: "string"
      - name: level_6
        description: "Spare"
        data_type: "string"
      - name: level_7
        description: "Spare"
        data_type: "string"
      - name: _source_system
        description: "Lineage"
        data_type: "string"
      - name: _source_updated_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_loaded_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_invocation_id
        description: "Lineage"
        data_type: "string"
