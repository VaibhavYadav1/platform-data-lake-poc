version: 2
models:
  - name: mv_incident_health
    description: One row per valid, health-relevant incident with the matched health rule, colour and downtime flag. Every other health mart reads from here.
    columns:
      - name: incident_id
        description: "Incident"
        data_type: "string"
        data_tests: [unique, not_null]
      - name: tenant_id
        description: "From fct_alert"
        data_type: "string"
      - name: store_id
        description: "Store"
        data_type: "string"
        data_tests: [not_null]
      - name: alert_type_id
        description: "Alert type"
        data_type: "string"
      - name: alert_name
        description: "Customer alert name"
        data_type: "string"
      - name: priority_name
        description: "P1 to P5"
        data_type: "string"
      - name: location_class
        description: "MAIN_DOOR, OTHER or UNKNOWN"
        data_type: "string"
      - name: alert_time
        description: "When the alert fired"
        data_type: "timestamp"
      - name: resolved_time
        description: "When it stopped"
        data_type: "timestamp"
      - name: is_open
        description: "By is_open_alert"
        data_type: "bool"
      - name: severity
        description: "From dim_alert_type"
        data_type: "string"
      - name: customer_category_name
        description: "From dim_alert_type"
        data_type: "string"
      - name: health_color
        description: RED, YELLOW or GREEN from the matched rule; null when no rule matches
        data_type: string
        data_tests:
          - accepted_values: {values: [RED, YELLOW, GREEN]}
      - name: health_rule_id
        description: "Matched rule; null when unclassified"
        data_type: "string"
      - name: is_unclassified
        description: "health_color is null"
        data_type: "bool"
      - name: effective_color
        description: "health_color, or YELLOW when unclassified"
        data_type: "string"
      - name: counts_as_downtime
        description: "health_color is RED"
        data_type: "bool"
      - name: downtime_cause_type
        description: "Power, Network, Protection, Disabled, Hardware or Other (proposed mapping)"
        data_type: "string"
      - name: snapshot_ts
        description: "The run's as-of time"
        data_type: "timestamp"
      - name: brand
        description: "Brand name"
        data_type: "string"
      - name: ultimate_parent
        description: "Company"
        data_type: "string"
      - name: country
        description: "ISO country code"
        data_type: "string"
      - name: level_1
        description: "Region"
        data_type: "string"
      - name: level_2
        description: "Division"
        data_type: "string"
      - name: level_3
        description: "District"
        data_type: "string"
      - name: level_4
        description: "Spare"
        data_type: "string"
      - name: level_5
        description: "Spare"
        data_type: "string"
      - name: level_6
        description: "Spare"
        data_type: "string"
      - name: level_7
        description: "Spare"
        data_type: "string"
      - name: _source_system
        description: "Lineage"
        data_type: "string"
      - name: _source_updated_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_loaded_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_invocation_id
        description: "Lineage"
        data_type: "string"
