version: 2
models:
  - name: mv_store_health
    description: One row per active store - colour, reason, since when, the driving alert, next step, owner token, and 30-day downtime. status_since and the colour rules are proposals until specs.md fixes them.
    columns:
      - name: store_id
        description: "Store"
        data_type: "string"
        data_tests: [unique, not_null]
      - name: tenant_id
        description: "From dim_store"
        data_type: "string"
      - name: store_name
        description: "From dim_store"
        data_type: "string"
      - name: status_color
        description: RED, YELLOW or GREEN
        data_type: string
        data_tests:
          - not_null
          - accepted_values: {values: [RED, YELLOW, GREEN]}
      - name: status_reason
        description: The first outcome that holds
        data_type: string
        data_tests:
          - accepted_values: {values: [RED_CRITICAL, YELLOW_DEGRADED, YELLOW_UNCLASSIFIED, GREEN_INFO_ONLY, GREEN_NO_OPEN_ALERTS]}
      - name: status_label
        description: "Driving rule label or fixed wording"
        data_type: "string"
      - name: status_description
        description: "Driving rule description or fixed wording"
        data_type: "string"
      - name: recommended_action
        description: "Driving rule action or fixed wording"
        data_type: "string"
      - name: status_since
        description: "When the store entered its current colour (approximate)"
        data_type: "timestamp"
      - name: status_duration_minutes
        description: "snapshot_ts minus status_since"
        data_type: "int64"
      - name: total_alert_count
        description: "Open health-relevant incidents"
        data_type: "int64"
      - name: red_alert_count
        description: "Open RED incidents"
        data_type: "int64"
      - name: yellow_alert_count
        description: "Open YELLOW incidents excluding unclassified"
        data_type: "int64"
      - name: unclassified_alert_count
        description: "Open incidents with no rule"
        data_type: "int64"
      - name: last_alert_start
        description: "Latest alert_time of the store's health-relevant incidents"
        data_type: "timestamp"
      - name: driving_incident_id
        description: "Incident that explains the colour; null for GREEN"
        data_type: "string"
      - name: driving_alert_name
        description: "From the driving incident"
        data_type: "string"
      - name: driving_severity
        description: "From the driving incident"
        data_type: "string"
      - name: driving_customer_category
        description: "From the driving incident"
        data_type: "string"
      - name: driving_installed_location_name
        description: "Door of the driving incident"
        data_type: "string"
      - name: driving_main_door_indicator
        description: "From the driving incident"
        data_type: "bool"
      - name: driving_rule_id
        description: "Rule that coloured the driving incident"
        data_type: "string"
      - name: next_step_action
        description: "Status next step or the alert type's Not Started action"
        data_type: "string"
      - name: next_step_owner_token
        description: "Token of the driving incident's assignee"
        data_type: "string"
      - name: owner_team
        description: "Team of that assignee"
        data_type: "string"
      - name: total_downtime_minutes_30d
        description: "Merged RED downtime in the last 30 days"
        data_type: "int64"
      - name: uptime_pct_30d
        description: "1 minus downtime over 43200 minutes"
        data_type: "float64"
      - name: downtime_interval_count_30d
        description: "Merged periods overlapping the window"
        data_type: "int64"
      - name: longest_downtime_minutes_30d
        description: "Longest clipped period"
        data_type: "int64"
      - name: snapshot_ts
        description: "The run's as-of time"
        data_type: "timestamp"
      - name: brand
        description: "Brand name"
        data_type: "string"
      - name: ultimate_parent
        description: "Company"
        data_type: "string"
      - name: country
        description: "ISO country code"
        data_type: "string"
      - name: level_1
        description: "Region"
        data_type: "string"
      - name: level_2
        description: "Division"
        data_type: "string"
      - name: level_3
        description: "District"
        data_type: "string"
      - name: level_4
        description: "Spare"
        data_type: "string"
      - name: level_5
        description: "Spare"
        data_type: "string"
      - name: level_6
        description: "Spare"
        data_type: "string"
      - name: level_7
        description: "Spare"
        data_type: "string"
      - name: _source_system
        description: "Lineage"
        data_type: "string"
      - name: _source_updated_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_loaded_at
        description: "Lineage"
        data_type: "timestamp"
      - name: _dbt_invocation_id
        description: "Lineage"
        data_type: "string"
