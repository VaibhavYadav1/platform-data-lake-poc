version: 2
models:
  - name: int_crm__account
    description: Latest version of each CRM account (watermark merge on updated_at). AT-20 - 5 changed accounts rewrite exactly 5 rows.
    columns:
      - name: account_id
        description: "Merge key"
        data_tests: [unique, not_null]
      - name: updated_at
        description: "The watermark"
        data_tests: [not_null]
  - name: int_crm__store
    description: Latest version of each CRM store record
    columns:
      - name: crm_store_id
        description: "Merge key"
        data_tests: [unique, not_null]
  - name: int_crm__work_order
    description: Latest version of each work order
    columns:
      - name: work_order_id
        description: "Merge key"
        data_tests: [unique, not_null]
